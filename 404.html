<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zanpo</title>
<script>
  // Fallback de rutas SPA para GitHub Pages: si el navegador pide una ruta
  // interna de la app (p.ej. /app/ajustes tras recargar la página) que no
  // existe como archivo físico, la reenviamos a /app/ codificada en ?p=,
  // donde el snippet ya inyectado en app/index.html la reconstruye.
  (function () {
    var path = location.pathname;
    var prefix = '/app/';
    var idx = path.indexOf(prefix);

    if (idx !== -1) {
      // ruta dentro de la app -> reconstruir y volver a /app/?p=<resto>
      var resto = path.slice(idx + prefix.length - 1); // incluye la barra inicial
      var query = location.search ? '&' + location.search.slice(1) : '';
      location.replace('/app/?p=' + encodeURIComponent(resto) + query + location.hash);
    } else {
      // cualquier otra ruta desconocida -> a la portada
      location.replace('/');
    }
  })();
</script>
</head>
<body></body>
</html>
